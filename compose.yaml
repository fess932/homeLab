# HomeDeck: один контейнер — панель, проверки, опрос устройств и VictoriaMetrics.
# Запуск и обновление — README.md и docs/operations.md.
services:
  homedeck:
    # Готовый образ из GitHub Container Registry, его публикует CI на каждый push в main.
    # Для фиксированной версии вместо latest: sha-<коммит> или vX.Y.Z. Собрать локально — just image.
    image: ghcr.io/fess932/homelab:latest
    # Сеть хоста нужна поиску устройств («Найти устройства»): широковещательные UDP-анонсы
    # Tuya (6666, 6667, 7000) через bridge-сеть Docker не доходят. UI и API открываются
    # на порту 8080 хоста; внутренние адреса ниже слушают только 127.0.0.1 хоста.
    network_mode: host
    volumes:
      - ./data:/data
      # Bluetooth через BlueZ хоста: сокет системной шины D-Bus. Контейнеру не нужны
      # дополнительные привилегии; доступ к BlueZ задаёт политика D-Bus на хосте.
      # - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket:ro
    # USB-адаптер Zigbee (Sonoff, SLZB и т. п.) или другое последовательное устройство.
    # Путь by-id не меняется при переподключении: ls /dev/serial/by-id/ на хосте.
    # devices:
    #   - /dev/serial/by-id/usb-ITead_Sonoff_Zigbee_3.0_USB_Dongle_Plus-if00-port0:/dev/zigbee
    # Процесс работает не от root: права на последовательные порты даёт группа dialout
    # (GID 20 в Debian, Ubuntu и Alpine; на хосте проверьте: stat -c %g /dev/ttyUSB0).
    # group_add:
    #   - "20"
    # Прямой доступ к Bluetooth-адаптеру без BlueZ хоста. Ослабляет изоляцию — только
    # если вариант с D-Bus выше не подходит.
    # cap_add:
    #   - NET_ADMIN
    #   - NET_RAW
    environment:
      # Сколько хранить историю метрик (графики, датчики, проверки): 50 лет, то есть
      # фактически не удалять. Ограничить: 30d, 12w, 1y… Больше 100y VictoriaMetrics не принимает.
      HOMEDECK_RETENTION: 50y
      # Если на хосте эти порты заняты, поменяйте их (по умолчанию: 8080, 127.0.0.1:8428,
      # 127.0.0.1:9091, 127.0.0.1:9092; 9091 часто занимает Prometheus Pushgateway).
      # HOMEDECK_LISTEN: ":8080"
      # HOMEDECK_VM_LISTEN: 127.0.0.1:8428
      # HOMEDECK_INTERNAL_LISTEN: 127.0.0.1:9091
      # HOMEDECK_EGRESS_LISTEN: 127.0.0.1:9092
      # Имена и IP, по которым открывается панель: защита setup и публичной страницы
      # от DNS rebinding. Рекомендуется задать.
      # HOMEDECK_ALLOWED_HOSTS: homedeck.lan,192.168.0.10
      # Reverse proxy с HTTPS перед панелью: иначе cookie будут без Secure.
      # HOMEDECK_TRUSTED_PROXIES: 192.168.0.2
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 1g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "/usr/local/bin/homedeck", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
